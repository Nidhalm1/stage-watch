name: Stage Watch sweep

on:
  schedule:
    # 15:00 UTC = 17:00 Europe/Paris in summer (CEST), 16:00 in winter (CET).
    # The Claude routine publishes at 16:00 UTC, so this deliberately leaves a
    # full hour of slack: GitHub's scheduled runs are frequently delayed 10-30
    # minutes under load, and if the sweep lands after the publish the routine
    # ships yesterday's board and reports "0 new" while a role may have opened.
    - cron: "0 15 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sweep the ATS APIs
        run: |
          # Batch 1 - Stage Watch (observability / infra / dev tools)
          cp board.html prev.html 2>/dev/null || true
          python make_board.py --prev prev.html --out board.html
          rm -f prev.html
          # Batch 2 - French Tech Watch (French tech / fintech / scale-ups).
          # Separate roster, separate board, separate state block. make_board.py
          # exits 2 without writing if every company in a roster fails, so a
          # broken sweep fails this step instead of committing an empty board.
          cp board2.html prev2.html 2>/dev/null || true
          python make_board.py --roster 2 --prev prev2.html --out board2.html
          rm -f prev2.html

      - name: Commit the new board
        run: |
          git config user.name  "stage-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add board.html board2.html
          git diff --staged --quiet || git commit -m "sweep $(date -u +%F)"
          git push
