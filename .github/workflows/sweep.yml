name: Stage Watch sweep

on:
  schedule:
    # 15:00 UTC = 17:00 Europe/Paris in summer (CEST), 16:00 in winter (CET).
    # The Claude routine publishes at 16:00 UTC, so this deliberately leaves a
    # full hour of slack: GitHub's scheduled runs are frequently delayed 10-30
    # minutes under load, and if the sweep lands after the publish the routine
    # ships yesterday's board and reports "0 new" while a role may have opened.
    - cron: "0 15 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab
    inputs:
      probe_html:
        description: "Space-separated probe_html.py sources to dump before sweeping (blank = skip)"
        required: false
        default: ""

# Two sweeps running at once would both commit the same files and the loser's
# push is rejected, silently dropping a sweep.
concurrency:
  group: stage-watch-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # One step per roster, and each one continue-on-error. These used to share
      # a single `run:` block, which GitHub executes under `bash -e`: when roster
      # 1 exited 2 ("every company failed", make_board.py refusing to write an
      # empty board) the step aborted, boards 2 and 3 were never built, and the
      # commit step never ran - three watches taken out by one bad roster. The
      # gate step at the end still turns the run red so a failure is visible.
      # A new workflow FILE cannot be dispatched from a feature branch - GitHub
      # only registers workflow_dispatch for files already on the default
      # branch - but a dispatch of THIS file runs the branch's version of it.
      # So the HTML-board probe rides along here until it can live on its own.
      # Blank input = skipped, which is what every scheduled run does.
      - name: Probe HTML job boards
        if: inputs.probe_html != '' && !startsWith(inputs.probe_html, 'new:')
        continue-on-error: true
        run: python probe_html.py ${{ inputs.probe_html }}

      # Same rider, for the 2026-09-06 batch of candidate APIs: a value of
      # "new:ibm amd sap" runs probe_new.py on those sources instead. It shares
      # the probe_html input because workflow_dispatch only offers the INPUTS
      # defined on the default branch, while the STEPS come from this branch.
      - name: Probe candidate APIs
        if: startsWith(inputs.probe_html, 'new:')
        continue-on-error: true
        env:
          PROBE_NEW: ${{ inputs.probe_html }}
        run: python probe_new.py ${PROBE_NEW#new:}

      - name: Batch 1 - Stage Watch
        id: b1
        if: inputs.probe_html == ''
        continue-on-error: true
        run: |
          cp board.html prev.html 2>/dev/null || true
          python make_board.py --prev prev.html --out board.html
          rm -f prev.html

      - name: Batch 2 - French Tech Watch
        id: b2
        if: inputs.probe_html == ''
        continue-on-error: true
        run: |
          cp board2.html prev2.html 2>/dev/null || true
          python make_board.py --roster 2 --prev prev2.html --out board2.html
          rm -f prev2.html

      # Thales and Airbus are 6000+ posting Workday boards, fetched as a union of
      # the intern facet plus keyword searches, so this step takes ~70s longer
      # than the other two.
      - name: Batch 3 - Defence, Finance & Silicon Watch
        id: b3
        if: inputs.probe_html == ''
        continue-on-error: true
        run: |
          cp board3.html prev3.html 2>/dev/null || true
          python make_board.py --roster 3 --prev prev3.html --out board3.html
          rm -f prev3.html

      - name: Commit the new boards
        if: always() && inputs.probe_html == ''
        run: |
          git config user.name  "stage-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in board.html board2.html board3.html status.json audit.json audit.md; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "nothing changed this run"
            exit 0
          fi
          git commit -m "sweep $(date -u +%F)"
          # Retry on a rejected push: rebase onto whatever landed first rather
          # than dropping this sweep on the floor.
          for i in 1 2 3 4; do
            git push && exit 0
            echo "push rejected; rebasing and retrying ($i/4)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 5))
          done
          git push

      # continue-on-error above hides a failure from the job status, so restore
      # it here: a roster that stopped fetching should show up red in the
      # Actions tab, not pass quietly while its board goes stale.
      - name: Fail the run if a roster failed
        if: always() && inputs.probe_html == ''
        run: |
          rc=0
          for pair in "1:${{ steps.b1.outcome }}" "2:${{ steps.b2.outcome }}" "3:${{ steps.b3.outcome }}"; do
            n="${pair%%:*}"; o="${pair#*:}"
            if [ "$o" != "success" ]; then
              echo "::error::batch $n did not succeed ($o) - its board was not rebuilt"
              rc=1
            fi
          done
          exit $rc
